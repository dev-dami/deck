// The Deck RPC: what a local desktop app speaks to `deck serve --rpc` over
// a Unix socket. It mirrors pkg/remote.Backend one method each, so the
// phone (WebSocket, docs/remote-contract.md) and the desktop (gRPC) drive
// the same engine adapter. Times are Unix milliseconds; images travel as
// raw bytes.
syntax = "proto3";

package deck.v1;

option go_package = "github.com/dev-dami/deck/pkg/rpc/deckv1;deckv1";

service Deck {
  rpc Info(Empty) returns (InfoResponse);

  rpc ListSessions(Empty) returns (ListSessionsResponse);
  rpc CreateSession(CreateSessionRequest) returns (Session);
  rpc RenameSession(RenameSessionRequest) returns (Empty);
  rpc DeleteSession(SessionRef) returns (Empty);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);

  rpc Send(SendRequest) returns (SendResponse);
  rpc EditMessage(EditMessageRequest) returns (Empty);
  rpc Cancel(SessionRef) returns (Empty);
  rpc Interrupt(InterruptRequest) returns (Empty);
  rpc Continue(SessionRef) returns (Empty);

  rpc Queue(SessionRef) returns (QueueResponse);
  rpc Steer(QueueItemRef) returns (Empty);
  rpc CancelQueued(QueueItemRef) returns (Empty);

  rpc Roster(SessionRef) returns (RosterResponse);
  rpc Models(ModelsRequest) returns (ModelsResponse);
  rpc SetModel(SetModelRequest) returns (Empty);

  rpc GetMode(SessionRef) returns (ModeResponse);
  rpc SetMode(SetModeRequest) returns (Empty);

  // Approvals lists one session's pending approvals, or every session's
  // when session_id is empty.
  rpc Approvals(SessionRef) returns (ApprovalsResponse);
  rpc Answer(AnswerRequest) returns (AnswerResponse);

  rpc Changes(SessionRef) returns (ChangesResponse);

  // Git is the project's work tree: its branch and how it stands, its
  // recent branches and the pull request of its branch (when gh is set up).
  rpc GitStatus(Empty) returns (GitStatusResponse);
  // GitCheckout switches to a branch, or makes it first when create is set.
  rpc GitCheckout(GitCheckoutRequest) returns (Empty);
  // GitCommit stages every change and commits it.
  rpc GitCommit(GitCommitRequest) returns (Empty);
  rpc GitPush(Empty) returns (Empty);
  // GitPull fast-forwards the branch from its upstream.
  rpc GitPull(Empty) returns (Empty);
  // GitCreatePR opens a pull request from the branch (gh must be set up).
  rpc GitCreatePR(GitCreatePRRequest) returns (GitPullRequest);
  // GitMergePR merges the branch's pull request.
  rpc GitMergePR(GitMergePRRequest) returns (Empty);

  // Usage is what the agents used (tokens, cost, time, plan limits) and how
  // the user works, from Deck's local record. Nothing leaves the machine.
  rpc Usage(UsageRequest) returns (UsageResponse);

  // A terminal in the project folder: a shell on a pseudo-terminal. Open
  // starts one; TerminalOutput streams what it prints until it exits.
  rpc TerminalOpen(TerminalOpenRequest) returns (TerminalRef);
  rpc TerminalWrite(TerminalInput) returns (Empty);
  rpc TerminalResize(TerminalSize) returns (Empty);
  rpc TerminalClose(TerminalRef) returns (Empty);
  rpc TerminalOutput(TerminalRef) returns (stream TerminalChunk);

  // The thread's task board: what its agents split the work into, who
  // runs each task, races and their entries, reviews.
  rpc Board(SessionRef) returns (BoardResponse);
  // TaskAction acts on a task: cancel, retry, steer (with text), apply (a
  // worktree's work into the tree; keeps a race entry) or discard.
  rpc TaskAction(TaskActionRequest) returns (TaskActionResponse);
  // SetOrchestrate turns the scheduler and agents' subagents on or off.
  rpc SetOrchestrate(SetOrchestrateRequest) returns (Empty);
  // Agents is the thread's agents as a tree (subagents under the member
  // that started them) with what each runs right now.
  rpc Agents(SessionRef) returns (AgentsResponse);

  // Team is the link to teammates' Decks: who they are, whether they are
  // reachable, what their agents do, the threads they share with this one,
  // the team chat and the contracts both ways.
  rpc Team(Empty) returns (TeamResponse);
  rpc TeamPost(TeamPostRequest) returns (TeamPostResponse);
  // ShareThread shares a thread with a teammate as observer, participant
  // or editor, or stops sharing it (role "").
  rpc ShareThread(ShareThreadRequest) returns (Empty);
  rpc ThreadShares(SessionRef) returns (ThreadSharesResponse);
  // ProposeContract asks a teammate's Deck to do a task for the thread.
  rpc ProposeContract(ProposeContractRequest) returns (ProposeContractResponse);
  // AnswerContract accepts (with an agent kind) or declines one proposed
  // to this Deck.
  rpc AnswerContract(AnswerContractRequest) returns (Empty);
  // ReadShared follows a thread a teammate shares with this Deck.
  rpc ReadShared(ReadSharedRequest) returns (SharedMirror);
  rpc PostShared(PostSharedRequest) returns (Empty);
  rpc AnswerShared(AnswerSharedRequest) returns (Empty);

  // The room calls. Info.capabilities names the ones this Deck serves.
  // IsolateSession moves the thread onto a git worktree and branch of its
  // own; its agents restart there.
  rpc IsolateSession(SessionRef) returns (Empty);
  // ApplyIsolated writes what an isolated thread changed since it started
  // (or since the last apply) into the shared tree as uncommitted edits.
  rpc ApplyIsolated(SessionRef) returns (FilesResponse);
  // UnisolateSession moves the thread back to the shared tree and removes
  // its worktree and branch, discarding what was never applied.
  rpc UnisolateSession(SessionRef) returns (Empty);
  // RevertFiles puts files back the way they were before a message.
  rpc RevertFiles(RevertFilesRequest) returns (FilesResponse);
  // UndoRevert takes the files of the thread's latest revert back to how
  // they were just before it.
  rpc UndoRevert(SessionRef) returns (Empty);
  // ArchiveSession stops the thread's agents and marks it archived. The
  // next message brings it back.
  rpc ArchiveSession(SessionRef) returns (Empty);
  // UnarchiveSession brings an archived thread back to the list.
  rpc UnarchiveSession(SessionRef) returns (Empty);
  // UndoApply takes the shared tree back to how it was before the thread's
  // last ApplyIsolated, if those files have not changed since. It returns
  // the files it put back.
  rpc UndoApply(SessionRef) returns (FilesResponse);
  // StartRace has count agents of kind do one brief, each on a worktree of
  // its own, as the agents' task.race does.
  rpc StartRace(StartRaceRequest) returns (StartRaceResponse);
  // ListFiles lists the files of the thread's tree (its worktree when
  // isolated) that match query, minus what the repository ignores.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  // ReadImage returns the bytes of a message's image part: index counts
  // the message's image parts from 0.
  rpc ReadImage(ReadImageRequest) returns (ReadImageResponse);
  // SearchMessages finds text in the messages of every thread of the
  // project that is not archived, newest first.
  rpc SearchMessages(SearchMessagesRequest) returns (SearchMessagesResponse);
  // ListProfiles lists the named agents (deck.json "profiles") of the
  // project: the global ones with the project's laid over them by name,
  // each with its scope. Invalid entries are left out; deck doctor says
  // why.
  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse);
  // SaveProfile validates a profile and writes it to its scope's deck.json,
  // replacing the one of the same name there. A broken rule comes back as
  // InvalidArgument, in Deck's words.
  rpc SaveProfile(SaveProfileRequest) returns (SaveProfileResponse);
  // DeleteProfile removes the profile called name from its scope's
  // deck.json; NotFound when that scope has none.
  rpc DeleteProfile(DeleteProfileRequest) returns (DeleteProfileResponse);

  // Events streams everything that happens, starting with a Ready. Pass the
  // epoch and seq of the last event seen to replay what was missed; Ready
  // says resync when that cannot be done and the client must refetch.
  rpc Events(Subscribe) returns (stream Event);
}

message Empty {}

message SessionRef {
  string session_id = 1;
}

message QueueItemRef {
  string session_id = 1;
  string item_id = 2;
}

message InfoResponse {
  string version = 1;
  string project = 2;
  repeated string kinds = 3;
  Theme theme = 4;
  repeated AgentCli clis = 5;
  // capabilities names the optional methods this Deck serves, such as
  // "IsolateSession" or "ListFiles".
  repeated string capabilities = 6;
}

message AgentCli {
  string kind = 1;
  string path = 2;
  bool found = 3;
  // logged_in is never set: telling means running the CLI's own status
  // command, which takes seconds (deck doctor does it).
  optional bool logged_in = 4;
}

message Theme {
  map<string, string> palette = 1;
  map<string, KindTone> kinds = 2;
}

message KindTone {
  string tint = 1;
  string mark = 2;
}

message Session {
  string id = 1;
  string title = 2;
  int64 updated_at = 3;
  bool busy = 4;
  int32 pending = 5;
  string mode = 6;
  string last_text = 7;
  // attention says what the session waits for from the person: "" for
  // nothing, "approval" (a command or an edit), "question" (an agent asks
  // something else), "error" (an agent stopped with an error) or "blocked"
  // (a task is blocked or failed).
  string attention = 8;
  // branch is the thread's worktree branch when it is isolated.
  string branch = 9;
  bool archived = 10;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message CreateSessionRequest {
  string title = 1;
  // isolate starts the thread on a worktree and branch of its own.
  bool isolate = 2;
}

message RenameSessionRequest {
  string session_id = 1;
  string title = 2;
}

message Message {
  string id = 1;
  string session_id = 2;
  string role = 3;
  string agent = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
  bool finished = 7;
  bool editable = 8;
  bool edited = 9;
  repeated Part parts = 10;
}

message Part {
  string type = 1;
  string text = 2;
  string id = 3;
  string name = 4;
  string summary = 5;
  string tool_call_id = 6;
  bool is_error = 7;
  string output = 8;
  string diff = 9;
  ImageRef image = 10;
}

message ImageRef {
  string name = 1;
  string mime = 2;
}

message ListMessagesRequest {
  string session_id = 1;
  // before is the cursor of a previous page; empty fetches the newest.
  string before = 2;
  int32 limit = 3;
}

message ListMessagesResponse {
  repeated Message messages = 1;
  bool more = 2;
  string cursor = 3;
}

message Image {
  string name = 1;
  string mime = 2;
  bytes data = 3;
}

message SendRequest {
  string session_id = 1;
  string text = 2;
  repeated Image images = 3;
}

message SendResponse {
  string message_id = 1;
}

message EditMessageRequest {
  string session_id = 1;
  string message_id = 2;
  string text = 3;
}

message InterruptRequest {
  string session_id = 1;
  string agent = 2;
}

message QueuedItem {
  string id = 1;
  string agent = 2;
  string text = 3;
  int64 at = 4;
}

message QueueResponse {
  repeated QueuedItem items = 1;
}

message AgentLine {
  string id = 1;
  string name = 2;
  string kind = 3;
  string model = 4;
  string effort = 5;
  bool busy = 6;
  // profile is the named agent the member was started from ("" for none)
  // and role that profile's one-line role. name is the member's own name
  // (charles, charles-2); kind still says which CLI runs it.
  string profile = 7;
  string role = 8;
  // color is the profile's CSS colour; "" means the kind's hue.
  string color = 9;
}

message RosterResponse {
  repeated AgentLine agents = 1;
}

message ModelsRequest {
  string session_id = 1;
  string kind = 2;
}

message ModelChoice {
  string id = 1;
  string label = 2;
  repeated string efforts = 3;
  bool selected = 4;
}

message ModelsResponse {
  repeated ModelChoice models = 1;
}

message SetModelRequest {
  string session_id = 1;
  string kind = 2;
  string model = 3;
  string effort = 4;
}

message ModeResponse {
  string mode = 1;
}

message SetModeRequest {
  string session_id = 1;
  string mode = 2;
}

message Approval {
  string id = 1;
  string session_id = 2;
  string tool_call_id = 3;
  string agent = 4;
  string kind = 5;
  string description = 6;
  string command = 7;
  string path = 8;
  string diff = 9;
  string raw = 10;
  int64 created_at = 11;
}

message ApprovalsResponse {
  repeated Approval approvals = 1;
}

message AnswerRequest {
  string session_id = 1;
  string id = 2;
  // decision is allow, allow_session or deny.
  string decision = 3;
}

message AnswerResponse {
  // resolved is false when another UI answered first.
  bool resolved = 1;
}

message ChangedFile {
  string path = 1;
  int32 added = 2;
  int32 removed = 3;
  string diff = 4;
}

message ChangesResponse {
  repeated ChangedFile files = 1;
}

message Subscribe {
  string epoch = 1;
  uint64 seq = 2;
}

// Ready opens every Events stream.
message Ready {
  string epoch = 1;
  uint64 seq = 2;
  // resync is true when the events since the subscriber's position cannot
  // be replayed: refetch sessions, messages and approvals.
  bool resync = 3;
}

message MessageDeleted {
  string id = 1;
  string session_id = 2;
}

message ApprovalResolved {
  string id = 1;
  string session_id = 2;
  bool granted = 3;
}

message Busy {
  string session_id = 1;
  bool busy = 2;
}

message QueueChanged {
  string session_id = 1;
  repeated QueuedItem items = 2;
}

message ModeChanged {
  string session_id = 1;
  string mode = 2;
}

message Notice {
  string session_id = 1;
  string text = 2;
  // via marks a kind of note: "overlap" when two agents changed the same
  // file, or one changed a file another holds.
  string via = 3;
}

// LeaseChanged says an agent took a lease on files, gave it back, or that
// it ran out (released).
message LeaseChanged {
  string session_id = 1;
  string agent = 2;
  repeated string paths = 3;
  bool exclusive = 4;
  bool released = 5;
}

message Event {
  // seq numbers the events of one epoch; Ready carries 0.
  uint64 seq = 1;
  string session_id = 2;
  oneof kind {
    Ready ready = 10;
    Session session_created = 11;
    Session session_updated = 12;
    Session session_deleted = 13;
    Message message_created = 14;
    Message message_updated = 15;
    MessageDeleted message_deleted = 16;
    Approval approval_requested = 17;
    ApprovalResolved approval_resolved = 18;
    Busy busy = 19;
    QueueChanged queue_changed = 20;
    SessionRef roster_changed = 21;
    ModeChanged mode_changed = 22;
    Notice notice = 23;
    Theme theme_changed = 24;
    LeaseChanged lease_changed = 25;
  }
}

message GitBranch {
  string name = 1;
  // upstream is empty when the branch was never pushed.
  string upstream = 2;
  int64 committed_at = 3;
  string subject = 4;
}

message GitCheck {
  string name = 1;
  // bucket is "pass", "fail", "pending", "skipping" or "cancel".
  string bucket = 2;
  string link = 3;
}

message GitPullRequest {
  int32 number = 1;
  string title = 2;
  // state is OPEN, CLOSED or MERGED.
  string state = 3;
  string url = 4;
  bool draft = 5;
  string review_decision = 6;
  string mergeable = 7;
  string base = 8;
  repeated GitCheck checks = 9;
}

message GitStatusResponse {
  // repo is false when the project folder is not a git work tree; the
  // rest is then empty.
  bool repo = 1;
  string branch = 2;
  string upstream = 3;
  int32 ahead = 4;
  int32 behind = 5;
  // dirty counts changed, staged, unmerged and untracked files.
  int32 dirty = 6;
  bool detached = 7;
  string head = 8;
  string default_branch = 9;
  repeated GitBranch branches = 10;
  // gh is true when the GitHub CLI is installed and signed in.
  bool gh = 11;
  GitPullRequest pull_request = 12;
}

message GitCheckoutRequest {
  string branch = 1;
  bool create = 2;
}

message GitCommitRequest {
  string message = 1;
}

message GitCreatePRRequest {
  string title = 1;
  string body = 2;
  // base is empty for the repository's default branch.
  string base = 3;
  bool draft = 4;
}

message GitMergePRRequest {
  // method is "squash", "merge" or "rebase".
  string method = 1;
}

message UsageRequest {
  // days is the range: the last so many days, or 0 for all time.
  int32 days = 1;
}

message UsageOverview {
  int32 turns = 1;
  int32 all_turns = 2;
  int64 input_tokens = 3;
  int64 output_tokens = 4;
  int64 cached_tokens = 5;
  int64 cache_write_tokens = 6;
  int64 reasoning_tokens = 7;
  double cost_usd = 8;
  int64 duration_ms = 9;
  int64 ttft_avg_ms = 10;
  int64 ttft_p95_ms = 11;
  double cache_hit_pct = 12;
  int32 done = 13;
  int32 interrupted = 14;
  int32 failed = 15;
}

message UsageDay {
  // day is local midnight.
  int64 day = 1;
  int32 turns = 2;
  int64 tokens = 3;
  double cost_usd = 4;
}

message UsageGroup {
  string kind = 1;
  string model = 2;
  int32 turns = 3;
  int64 input_tokens = 4;
  int64 output_tokens = 5;
  int64 cached_tokens = 6;
  double cost_usd = 7;
}

message UsageSession {
  string session_id = 1;
  string title = 2;
  int32 turns = 3;
  int64 tokens = 4;
  double cost_usd = 5;
}

message UsageLimit {
  string agent_kind = 1;
  string window_id = 2;
  // kind is "session", "weekly", "monthly" or "other".
  string kind = 3;
  string label = 4;
  double used_pct = 5;
  int64 resets_at = 6;
  int32 duration_mins = 7;
  string plan = 8;
  int64 at = 9;
}

message UsageFit {
  string kind = 1;
  // class is "read", "edit", "run" or "other".
  string class = 2;
  int32 calls = 3;
}

message UsageHabits {
  int32 active_days = 1;
  int32 streak = 2;
  // hours counts finished turns by weekday (Monday first) and hour: 7 x 24.
  repeated int32 hours = 3;
  int64 review_median_ms = 4;
  int64 review_p90_ms = 5;
  int64 approval_median_ms = 6;
  double approval_fast_pct = 7;
  int32 user_turns = 8;
  int32 redirects = 9;
  int32 follow_ups = 10;
  int32 prompt_median = 11;
  int32 edit_turns = 12;
  int32 edit_files = 13;
  int32 lines_added = 14;
  int32 lines_removed = 15;
  int32 reverts = 16;
  repeated UsageFit fit = 17;
}

message UsageResponse {
  // available is false when Deck keeps no record (no database).
  bool available = 1;
  UsageOverview overview = 2;
  // days has one entry per day of the range, oldest first.
  repeated UsageDay days = 3;
  repeated UsageGroup kinds = 4;
  repeated UsageGroup models = 5;
  // sessions are the costliest of the range.
  repeated UsageSession sessions = 6;
  repeated UsageLimit limits = 7;
  // heat is every day of the last weeks, from a Monday.
  repeated UsageDay heat = 8;
  UsageHabits habits = 9;
}

message TerminalOpenRequest {
  int32 cols = 1;
  int32 rows = 2;
}

message TerminalRef {
  string terminal_id = 1;
}

message TerminalInput {
  string terminal_id = 1;
  bytes data = 2;
}

message TerminalSize {
  string terminal_id = 1;
  int32 cols = 2;
  int32 rows = 3;
}

message TerminalChunk {
  bytes data = 1;
  // exited is set on the last chunk, when the shell has ended.
  bool exited = 2;
  int32 exit_code = 3;
}

message BoardTask {
  string id = 1;
  string title = 2;
  // status is pending, ready, running, review, blocked, done, failed or
  // cancelled.
  string status = 3;
  string owner = 4;
  repeated string deps = 5;
  string brief = 6;
  string result = 7;
  string error = 8;
  int32 attempts = 9;
  int32 tries = 10;
  string branch = 11;
  int64 updated_at = 12;
  bool race = 13;
  bool entry = 14;
  string stats = 15;
  repeated string files = 16;
  string reviewer = 17;
  int32 reviews = 18;
}

message BoardResponse {
  bool orchestrate = 1;
  repeated BoardTask tasks = 2;
}

message TaskActionRequest {
  string session_id = 1;
  string task_id = 2;
  // action is cancel, retry, steer, apply or discard.
  string action = 3;
  string text = 4;
}

message TaskActionResponse {
  // files are what an apply wrote into the tree.
  repeated string files = 1;
}

message SetOrchestrateRequest {
  string session_id = 1;
  bool on = 2;
}

message AgentNode {
  string name = 1;
  string kind = 2;
  string model = 3;
  string effort = 4;
  // status is idle, working, tool, approval, error, exited or ready.
  string status = 5;
  int32 context_tokens = 6;
  int32 context_window = 7;
  double cost_usd = 8;
  int32 pending = 9;
  int64 since = 10;
  int32 depth = 11;
  string parent = 12;
  string branch = 13;
  string leases = 14;
  // profile, role and color: as AgentLine's.
  string profile = 15;
  string role = 16;
  string color = 17;
}

message RunningTool {
  string agent = 1;
  string kind = 2;
  string name = 3;
  string summary = 4;
  string detail = 5;
  int64 started = 6;
  // subagent is set for a CLI's own subagent (Claude's Task), command for a
  // shell command.
  bool subagent = 7;
  bool command = 8;
}

message AgentsResponse {
  repeated AgentNode agents = 1;
  repeated RunningTool running = 2;
}

message TeamAgent {
  string name = 1;
  string kind = 2;
  string status = 3;
  string task = 4;
  int32 context_pct = 5;
}

message TeamThread {
  string id = 1;
  string title = 2;
  string role = 3;
  string mode = 4;
  repeated string members = 5;
  int32 entries = 6;
}

message Teammate {
  string name = 1;
  string role = 2;
  bool pinned = 3;
  // link is "online", "connecting", "offline" or "" when never linked.
  string link = 4;
  int64 last_seen = 5;
  bool present = 6;
  repeated TeamAgent agents = 7;
  repeated TeamThread threads = 8;
}

message TeamChat {
  uint64 seq = 1;
  string from = 2;
  string agent = 3;
  string text = 4;
  int64 at = 5;
  bool mine = 6;
}

message TeamContract {
  string id = 1;
  string peer = 2;
  bool inbound = 3;
  string title = 4;
  string brief = 5;
  // state is proposed, accepted, declined, done, failed or cancelled.
  string state = 6;
  string agent = 7;
  string note = 8;
  string summary = 9;
  string kind = 10;
}

message TeamResponse {
  // available is false when this Deck has no peer link.
  bool available = 1;
  bool enabled = 2;
  string name = 3;
  string fingerprint = 4;
  repeated Teammate teammates = 5;
  repeated TeamChat chat = 6;
  repeated TeamContract contracts = 7;
  // contract_kinds are the agent kinds that may run a teammate's contract.
  repeated string contract_kinds = 8;
}

message TeamPostRequest {
  string text = 1;
}

message TeamPostResponse {
  repeated string reached = 1;
}

message ShareThreadRequest {
  string session_id = 1;
  string peer = 2;
  string role = 3;
}

message ThreadSharesResponse {
  map<string, string> shares = 1;
}

message ProposeContractRequest {
  string session_id = 1;
  string peer = 2;
  string brief = 3;
}

message ProposeContractResponse {
  string task_id = 1;
  bool queued = 2;
}

message AnswerContractRequest {
  string peer = 1;
  string id = 2;
  bool accept = 3;
  string agent = 4;
}

message ReadSharedRequest {
  string peer = 1;
  string thread = 2;
  int32 after = 3;
}

message SharedApproval {
  string id = 1;
  string agent = 2;
  string kind = 3;
  string summary = 4;
}

message SharedMirror {
  TeamThread thread = 1;
  repeated string lines = 2;
  int32 next = 3;
  repeated SharedApproval pending = 4;
}

message PostSharedRequest {
  string peer = 1;
  string thread = 2;
  string text = 3;
}

message AnswerSharedRequest {
  string peer = 1;
  string thread = 2;
  string approval = 3;
  bool allow = 4;
}

message FilesResponse {
  repeated string files = 1;
}

message RevertFilesRequest {
  string session_id = 1;
  // since is a time (Unix ms): the files go back to how they were before
  // the first message at or after it. 0 means the checkpoint Changes
  // measures from.
  int64 since = 2;
  repeated string paths = 3;
}

message StartRaceRequest {
  string session_id = 1;
  string brief = 2;
  string kind = 3;
  int32 count = 4;
  // judge has an agent of the same kind rank the entries.
  bool judge = 5;
}

message StartRaceResponse {
  string task_id = 1;
}

message ListFilesRequest {
  string session_id = 1;
  string query = 2;
  // limit is at most 500; 0 means 100.
  int32 limit = 3;
}

message ListFilesResponse {
  // paths are relative to the thread's folder, with forward slashes.
  repeated string paths = 1;
  bool truncated = 2;
}

message ReadImageRequest {
  string session_id = 1;
  string message_id = 2;
  int32 index = 3;
}

message ReadImageResponse {
  bytes data = 1;
  string mime = 2;
}

message SearchMessagesRequest {
  string query = 1;
  // limit is at most 200; 0 means 30.
  int32 limit = 2;
}

message SearchHit {
  string session_id = 1;
  string message_id = 2;
  string agent = 3;
  // snippet is the text around the first match, on one line.
  string snippet = 4;
  // at is when the message was written (Unix ms).
  int64 at = 5;
}

message SearchMessagesResponse {
  repeated SearchHit hits = 1;
}

// Profile is a named agent: a recipe for a member of a thread, addressed
// as @name (docs/design/agents-and-mentions.md). name and kind are
// required; the rest default to the kind's.
message Profile {
  // name is how it is addressed and shown: letters, digits, - and _, at
  // most 32; not all, user, deck, an agent kind or a teammate's name.
  // Names compare case-insensitively.
  string name = 1;
  // kind is the CLI it runs: claude, codex, opencode or antigravity.
  string kind = 2;
  string model = 3;
  string effort = 4;
  // role is one line, shown in the roster and briefed.
  string role = 5;
  // instructions are standing instructions, appended to the briefing.
  string instructions = 6;
  // voice is one line of personality, briefed after the instructions.
  string voice = 7;
  // color is a CSS colour for its hue; "" means the kind's.
  string color = 8;
  // paths are globs the agent should keep to.
  repeated string paths = 9;
  // scope is where it lives: "global" (the user's deck.json) or "project"
  // (the project's deck.json).
  string scope = 10;
}

message ListProfilesRequest {}

message ListProfilesResponse {
  repeated Profile profiles = 1;
}

message SaveProfileRequest {
  // profile.scope says which deck.json it is written to.
  Profile profile = 1;
}

message SaveProfileResponse {
  // profile is what was saved, as ListProfiles shows it.
  Profile profile = 1;
}

message DeleteProfileRequest {
  string name = 1;
  // scope is "global" or "project".
  string scope = 2;
}

message DeleteProfileResponse {}
