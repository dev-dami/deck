// The Deck RPC: what a local desktop app speaks to `deck serve --rpc` over
// a Unix socket. It mirrors pkg/remote.Backend one method each, so the
// phone (WebSocket, docs/remote-contract.md) and the desktop (gRPC) drive
// the same engine adapter. Times are Unix milliseconds; images travel as
// raw bytes.
syntax = "proto3";

package deck.v1;

option go_package = "github.com/dev-dami/deck/pkg/rpc/deckv1;deckv1";

service Deck {
  rpc Info(Empty) returns (InfoResponse);

  rpc ListSessions(Empty) returns (ListSessionsResponse);
  rpc CreateSession(CreateSessionRequest) returns (Session);
  rpc RenameSession(RenameSessionRequest) returns (Empty);
  rpc DeleteSession(SessionRef) returns (Empty);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);

  rpc Send(SendRequest) returns (SendResponse);
  rpc EditMessage(EditMessageRequest) returns (Empty);
  rpc Cancel(SessionRef) returns (Empty);
  rpc Interrupt(InterruptRequest) returns (Empty);
  rpc Continue(SessionRef) returns (Empty);

  rpc Queue(SessionRef) returns (QueueResponse);
  rpc Steer(QueueItemRef) returns (Empty);
  rpc CancelQueued(QueueItemRef) returns (Empty);

  rpc Roster(SessionRef) returns (RosterResponse);
  rpc Models(ModelsRequest) returns (ModelsResponse);
  rpc SetModel(SetModelRequest) returns (Empty);

  rpc GetMode(SessionRef) returns (ModeResponse);
  rpc SetMode(SetModeRequest) returns (Empty);

  // Approvals lists one session's pending approvals, or every session's
  // when session_id is empty.
  rpc Approvals(SessionRef) returns (ApprovalsResponse);
  rpc Answer(AnswerRequest) returns (AnswerResponse);

  rpc Changes(SessionRef) returns (ChangesResponse);

  // Git is the project's work tree: its branch and how it stands, its
  // recent branches and the pull request of its branch (when gh is set up).
  rpc GitStatus(Empty) returns (GitStatusResponse);
  // GitCheckout switches to a branch, or makes it first when create is set.
  rpc GitCheckout(GitCheckoutRequest) returns (Empty);
  // GitCommit stages every change and commits it.
  rpc GitCommit(GitCommitRequest) returns (Empty);
  rpc GitPush(Empty) returns (Empty);
  // GitPull fast-forwards the branch from its upstream.
  rpc GitPull(Empty) returns (Empty);
  // GitCreatePR opens a pull request from the branch (gh must be set up).
  rpc GitCreatePR(GitCreatePRRequest) returns (GitPullRequest);
  // GitMergePR merges the branch's pull request.
  rpc GitMergePR(GitMergePRRequest) returns (Empty);

  // Usage is what the agents used (tokens, cost, time, plan limits) and how
  // the user works, from Deck's local record. Nothing leaves the machine.
  rpc Usage(UsageRequest) returns (UsageResponse);

  // A terminal in the project folder: a shell on a pseudo-terminal. Open
  // starts one; TerminalOutput streams what it prints until it exits.
  rpc TerminalOpen(TerminalOpenRequest) returns (TerminalRef);
  rpc TerminalWrite(TerminalInput) returns (Empty);
  rpc TerminalResize(TerminalSize) returns (Empty);
  rpc TerminalClose(TerminalRef) returns (Empty);
  rpc TerminalOutput(TerminalRef) returns (stream TerminalChunk);

  // Events streams everything that happens, starting with a Ready. Pass the
  // epoch and seq of the last event seen to replay what was missed; Ready
  // says resync when that cannot be done and the client must refetch.
  rpc Events(Subscribe) returns (stream Event);
}

message Empty {}

message SessionRef {
  string session_id = 1;
}

message QueueItemRef {
  string session_id = 1;
  string item_id = 2;
}

message InfoResponse {
  string version = 1;
  string project = 2;
  repeated string kinds = 3;
  Theme theme = 4;
}

message Theme {
  map<string, string> palette = 1;
  map<string, KindTone> kinds = 2;
}

message KindTone {
  string tint = 1;
  string mark = 2;
}

message Session {
  string id = 1;
  string title = 2;
  int64 updated_at = 3;
  bool busy = 4;
  int32 pending = 5;
  string mode = 6;
  string last_text = 7;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message CreateSessionRequest {
  string title = 1;
}

message RenameSessionRequest {
  string session_id = 1;
  string title = 2;
}

message Message {
  string id = 1;
  string session_id = 2;
  string role = 3;
  string agent = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
  bool finished = 7;
  bool editable = 8;
  bool edited = 9;
  repeated Part parts = 10;
}

message Part {
  string type = 1;
  string text = 2;
  string id = 3;
  string name = 4;
  string summary = 5;
  string tool_call_id = 6;
  bool is_error = 7;
  string output = 8;
  string diff = 9;
  ImageRef image = 10;
}

message ImageRef {
  string name = 1;
  string mime = 2;
}

message ListMessagesRequest {
  string session_id = 1;
  // before is the cursor of a previous page; empty fetches the newest.
  string before = 2;
  int32 limit = 3;
}

message ListMessagesResponse {
  repeated Message messages = 1;
  bool more = 2;
  string cursor = 3;
}

message Image {
  string name = 1;
  string mime = 2;
  bytes data = 3;
}

message SendRequest {
  string session_id = 1;
  string text = 2;
  repeated Image images = 3;
}

message SendResponse {
  string message_id = 1;
}

message EditMessageRequest {
  string session_id = 1;
  string message_id = 2;
  string text = 3;
}

message InterruptRequest {
  string session_id = 1;
  string agent = 2;
}

message QueuedItem {
  string id = 1;
  string agent = 2;
  string text = 3;
  int64 at = 4;
}

message QueueResponse {
  repeated QueuedItem items = 1;
}

message AgentLine {
  string id = 1;
  string name = 2;
  string kind = 3;
  string model = 4;
  string effort = 5;
  bool busy = 6;
}

message RosterResponse {
  repeated AgentLine agents = 1;
}

message ModelsRequest {
  string session_id = 1;
  string kind = 2;
}

message ModelChoice {
  string id = 1;
  string label = 2;
  repeated string efforts = 3;
  bool selected = 4;
}

message ModelsResponse {
  repeated ModelChoice models = 1;
}

message SetModelRequest {
  string session_id = 1;
  string kind = 2;
  string model = 3;
  string effort = 4;
}

message ModeResponse {
  string mode = 1;
}

message SetModeRequest {
  string session_id = 1;
  string mode = 2;
}

message Approval {
  string id = 1;
  string session_id = 2;
  string tool_call_id = 3;
  string agent = 4;
  string kind = 5;
  string description = 6;
  string command = 7;
  string path = 8;
  string diff = 9;
  string raw = 10;
  int64 created_at = 11;
}

message ApprovalsResponse {
  repeated Approval approvals = 1;
}

message AnswerRequest {
  string session_id = 1;
  string id = 2;
  // decision is allow, allow_session or deny.
  string decision = 3;
}

message AnswerResponse {
  // resolved is false when another UI answered first.
  bool resolved = 1;
}

message ChangedFile {
  string path = 1;
  int32 added = 2;
  int32 removed = 3;
  string diff = 4;
}

message ChangesResponse {
  repeated ChangedFile files = 1;
}

message Subscribe {
  string epoch = 1;
  uint64 seq = 2;
}

// Ready opens every Events stream.
message Ready {
  string epoch = 1;
  uint64 seq = 2;
  // resync is true when the events since the subscriber's position cannot
  // be replayed: refetch sessions, messages and approvals.
  bool resync = 3;
}

message MessageDeleted {
  string id = 1;
  string session_id = 2;
}

message ApprovalResolved {
  string id = 1;
  string session_id = 2;
  bool granted = 3;
}

message Busy {
  string session_id = 1;
  bool busy = 2;
}

message QueueChanged {
  string session_id = 1;
  repeated QueuedItem items = 2;
}

message ModeChanged {
  string session_id = 1;
  string mode = 2;
}

message Notice {
  string session_id = 1;
  string text = 2;
}

message Event {
  // seq numbers the events of one epoch; Ready carries 0.
  uint64 seq = 1;
  string session_id = 2;
  oneof kind {
    Ready ready = 10;
    Session session_created = 11;
    Session session_updated = 12;
    Session session_deleted = 13;
    Message message_created = 14;
    Message message_updated = 15;
    MessageDeleted message_deleted = 16;
    Approval approval_requested = 17;
    ApprovalResolved approval_resolved = 18;
    Busy busy = 19;
    QueueChanged queue_changed = 20;
    SessionRef roster_changed = 21;
    ModeChanged mode_changed = 22;
    Notice notice = 23;
    Theme theme_changed = 24;
  }
}

message GitBranch {
  string name = 1;
  // upstream is empty when the branch was never pushed.
  string upstream = 2;
  int64 committed_at = 3;
  string subject = 4;
}

message GitCheck {
  string name = 1;
  // bucket is "pass", "fail", "pending", "skipping" or "cancel".
  string bucket = 2;
  string link = 3;
}

message GitPullRequest {
  int32 number = 1;
  string title = 2;
  // state is OPEN, CLOSED or MERGED.
  string state = 3;
  string url = 4;
  bool draft = 5;
  string review_decision = 6;
  string mergeable = 7;
  string base = 8;
  repeated GitCheck checks = 9;
}

message GitStatusResponse {
  // repo is false when the project folder is not a git work tree; the
  // rest is then empty.
  bool repo = 1;
  string branch = 2;
  string upstream = 3;
  int32 ahead = 4;
  int32 behind = 5;
  // dirty counts changed, staged, unmerged and untracked files.
  int32 dirty = 6;
  bool detached = 7;
  string head = 8;
  string default_branch = 9;
  repeated GitBranch branches = 10;
  // gh is true when the GitHub CLI is installed and signed in.
  bool gh = 11;
  GitPullRequest pull_request = 12;
}

message GitCheckoutRequest {
  string branch = 1;
  bool create = 2;
}

message GitCommitRequest {
  string message = 1;
}

message GitCreatePRRequest {
  string title = 1;
  string body = 2;
  // base is empty for the repository's default branch.
  string base = 3;
  bool draft = 4;
}

message GitMergePRRequest {
  // method is "squash", "merge" or "rebase".
  string method = 1;
}

message UsageRequest {
  // days is the range: the last so many days, or 0 for all time.
  int32 days = 1;
}

message UsageOverview {
  int32 turns = 1;
  int32 all_turns = 2;
  int64 input_tokens = 3;
  int64 output_tokens = 4;
  int64 cached_tokens = 5;
  int64 cache_write_tokens = 6;
  int64 reasoning_tokens = 7;
  double cost_usd = 8;
  int64 duration_ms = 9;
  int64 ttft_avg_ms = 10;
  int64 ttft_p95_ms = 11;
  double cache_hit_pct = 12;
  int32 done = 13;
  int32 interrupted = 14;
  int32 failed = 15;
}

message UsageDay {
  // day is local midnight.
  int64 day = 1;
  int32 turns = 2;
  int64 tokens = 3;
  double cost_usd = 4;
}

message UsageGroup {
  string kind = 1;
  string model = 2;
  int32 turns = 3;
  int64 input_tokens = 4;
  int64 output_tokens = 5;
  int64 cached_tokens = 6;
  double cost_usd = 7;
}

message UsageSession {
  string session_id = 1;
  string title = 2;
  int32 turns = 3;
  int64 tokens = 4;
  double cost_usd = 5;
}

message UsageLimit {
  string agent_kind = 1;
  string window_id = 2;
  // kind is "session", "weekly", "monthly" or "other".
  string kind = 3;
  string label = 4;
  double used_pct = 5;
  int64 resets_at = 6;
  int32 duration_mins = 7;
  string plan = 8;
  int64 at = 9;
}

message UsageFit {
  string kind = 1;
  // class is "read", "edit", "run" or "other".
  string class = 2;
  int32 calls = 3;
}

message UsageHabits {
  int32 active_days = 1;
  int32 streak = 2;
  // hours counts finished turns by weekday (Monday first) and hour: 7 x 24.
  repeated int32 hours = 3;
  int64 review_median_ms = 4;
  int64 review_p90_ms = 5;
  int64 approval_median_ms = 6;
  double approval_fast_pct = 7;
  int32 user_turns = 8;
  int32 redirects = 9;
  int32 follow_ups = 10;
  int32 prompt_median = 11;
  int32 edit_turns = 12;
  int32 edit_files = 13;
  int32 lines_added = 14;
  int32 lines_removed = 15;
  int32 reverts = 16;
  repeated UsageFit fit = 17;
}

message UsageResponse {
  // available is false when Deck keeps no record (no database).
  bool available = 1;
  UsageOverview overview = 2;
  // days has one entry per day of the range, oldest first.
  repeated UsageDay days = 3;
  repeated UsageGroup kinds = 4;
  repeated UsageGroup models = 5;
  // sessions are the costliest of the range.
  repeated UsageSession sessions = 6;
  repeated UsageLimit limits = 7;
  // heat is every day of the last weeks, from a Monday.
  repeated UsageDay heat = 8;
  UsageHabits habits = 9;
}

message TerminalOpenRequest {
  int32 cols = 1;
  int32 rows = 2;
}

message TerminalRef {
  string terminal_id = 1;
}

message TerminalInput {
  string terminal_id = 1;
  bytes data = 2;
}

message TerminalSize {
  string terminal_id = 1;
  int32 cols = 2;
  int32 rows = 3;
}

message TerminalChunk {
  bytes data = 1;
  // exited is set on the last chunk, when the shell has ended.
  bool exited = 2;
  int32 exit_code = 3;
}
