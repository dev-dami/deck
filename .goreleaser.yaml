# GoReleaser configuration: https://goreleaser.com
version: 2

project_name: deck

builds:
  - id: deck
    main: .
    binary: deck
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/dev-dami/deck/internal/version.Version={{.Version}}

archives:
  - id: deck
    ids: [deck]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - LICENSE.crush.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^Merge "

release:
  # Tags like v0.1.0-rc.1 are published as pre-releases.
  prerelease: auto
