# GoReleaser configuration: https://goreleaser.com
version: 2

project_name: deck

builds:
  - id: deck
    main: .
    binary: deck
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/dev-dami/deck/internal/version.Version={{.Version}}
      - -X github.com/dev-dami/deck/internal/version.Commit={{.ShortCommit}}
      - -X github.com/dev-dami/deck/internal/version.BuildID={{.ShortCommit}}

archives:
  - id: deck
    ids: [deck]
    formats: [tar.gz]
    # GitHub renames assets with a "+" in them, so build metadata (v0.8.0-dev+x)
    # is written with a "-" in file names; the installers do the same.
    name_template: '{{ .ProjectName }}_{{ replace .Version "+" "-" }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - LICENSE.crush.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^Merge "

release:
  # Tags with a suffix (v0.8.0-dev, v0.8.0-rc.1) are published as pre-releases.
  prerelease: auto
  header: |
    ## Install

    macOS / Linux:
    ```sh
    curl -fsSL https://raw.githubusercontent.com/dev-dami/deck/main/install.sh | DECK_VERSION={{ .Tag }} sh
    ```

    Windows (PowerShell):
    ```powershell
    $env:DECK_VERSION='{{ .Tag }}'; irm https://raw.githubusercontent.com/dev-dami/deck/main/install.ps1 | iex
    ```

    Then run `deck doctor`. Deck drives the agent CLIs you already have signed in: claude, codex, opencode, agy.
