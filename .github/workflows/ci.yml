name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # gofmt output does not depend on the OS, so one leg is enough.
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

  # The suite is still being brought over from the Crush fork, so a failing
  # test is reported here without failing the run. Drop continue-on-error once
  # it is green. Live tests are gated on DECK_LIVE and skip here.
  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        run: go test ./...

  # The phone client is built from web/remote and committed to
  # internal/remote/web/dist so `go install` needs no JavaScript toolchain.
  # This job fails if the committed build is stale.
  web:
    name: web (remote client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/remote
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run build

      - name: committed build is current
        working-directory: .
        run: git diff --exit-code -- internal/remote/web/dist
