name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # gofmt output does not depend on the OS, so one leg is enough.
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # The full suite runs on Linux only; this checks the ConPTY terminal
      # driver on a real Windows console.
      - name: terminal (Windows)
        if: runner.os == 'Windows'
        run: go test -run "^TestTerminal" ./pkg/rpc/

  # Live tests are gated on DECK_LIVE and skip here.
  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        run: go test ./...

  # The phone remote control (pkg/remote) is new code with a full suite, so
  # its tests fail the run, unlike the suite above.
  remote:
    name: remote (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test pkg/remote
        run: go test ./pkg/remote/... ./internal/workspace/ ./internal/cmd/

  # The desktop app (desktop-shell). It imports the phone client's sources
  # and loads proto/deck/v1/deck.proto, so changes there can break it too.
  # Playwright runs the renderer in Chromium and the whole app in Electron,
  # under xvfb. The runner is pinned to Ubuntu 24.04: ubuntu-latest moved to
  # 26.04, which Playwright 1.56 cannot install Chromium or its system
  # libraries for ("Playwright does not support chromium on ubuntu26.04-x64").
  desktop:
    name: desktop (ubuntu-24.04)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop-shell
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-shell/package-lock.json

      - run: npm ci

      # Electron 44 fetches its binary on first use, not on install, so the
      # first Electron test would download it from GitHub's releases inside
      # its 30s timeout. Fetch it here instead, retrying GitHub's 503s.
      - name: install the Electron binary
        run: |
          for wait in 10 30 60 0; do
            npx install-electron && exit 0
            sleep "$wait"
          done
          exit 1

      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      # Ubuntu 24.04 blocks the user namespaces that Electron's sandbox
      # needs. The tests keep the sandbox on, so the runner allows them.
      - name: allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: xvfb-run -a npm run e2e

      # What the page showed when a test failed (error-context.md, traces).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-results
          path: desktop-shell/test-results/
          retention-days: 7

      - run: xvfb-run -a npm run smoke

  # The phone client is built from pkg/remote/web and its dist is committed,
  # so `go install` needs no JavaScript toolchain. The job fails if the
  # committed build is stale (docs/remote-contract.md section 7).
  web:
    name: web (phone client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pkg/remote/web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build

      # git status, not git diff: a new hashed asset that was built but never
      # committed is untracked, and git diff would not see it.
      - name: committed build is current
        working-directory: .
        run: |
          changed="$(git status --porcelain -- pkg/remote/web/dist)"
          if [ -n "$changed" ]; then
            echo "pkg/remote/web/dist is stale; run bun run build in pkg/remote/web and commit:"
            echo "$changed"
            exit 1
          fi
