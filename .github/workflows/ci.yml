name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # gofmt output does not depend on the OS, so one leg is enough.
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

  # Live tests are gated on DECK_LIVE and skip here.
  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        run: go test ./...

  # The phone remote control (pkg/remote) is new code with a full suite, so
  # its tests fail the run, unlike the suite above.
  remote:
    name: remote (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test pkg/remote
        run: go test ./pkg/remote/... ./internal/workspace/ ./internal/cmd/

  # The phone client is built from pkg/remote/web and its dist is committed,
  # so `go install` needs no JavaScript toolchain. The job fails if the
  # committed build is stale (docs/remote-contract.md section 7).
  web:
    name: web (phone client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pkg/remote/web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build

      # git status, not git diff: a new hashed asset that was built but never
      # committed is untracked, and git diff would not see it.
      - name: committed build is current
        working-directory: .
        run: |
          changed="$(git status --porcelain -- pkg/remote/web/dist)"
          if [ -n "$changed" ]; then
            echo "pkg/remote/web/dist is stale; run bun run build in pkg/remote/web and commit:"
            echo "$changed"
            exit 1
          fi
