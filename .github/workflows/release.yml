name: Release

# Two ways to cut a release:
#   - push a tag:        git tag v0.8.0 && git push origin v0.8.0
#   - or press the button: Actions → Release → Run workflow, version v0.8.0
#     (gh workflow run release.yml -f version=v0.8.0); the tag is made here.
# A version with a suffix (v0.8.0-dev, v0.8.0-rc.1) is published as a
# pre-release, so the one-line installers keep giving people the last full one.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.8.0 or v0.8.0-dev"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag
        id: tag
        env:
          INPUT: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT"
            case "$tag" in v*) ;; *) tag="v$tag" ;; esac
            if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
              echo "::error::$tag is not a version like v0.8.0, v0.8.0-dev or v0.8.0-dev+build.1"
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              # A retry of a run that failed before publishing: reuse the tag
              # when it is on this commit and has no release yet.
              if [ "$(git rev-parse "$tag^{commit}")" != "$(git rev-parse HEAD)" ]; then
                echo "::error::$tag already exists on another commit"
                exit 1
              fi
              if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                echo "::error::$tag is already released"
                exit 1
              fi
              echo "Reusing $tag from an earlier run"
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$tag" -m "$tag"
              git push origin "$tag"
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.tag }}

  # Download what was just published, on each system, and run it.
  verify:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, pattern: "deck_*_linux_amd64.tar.gz" }
          - { os: macos-latest, pattern: "deck_*_darwin_arm64.tar.gz" }
          - { os: windows-latest, pattern: "deck_*_windows_amd64.zip" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "${{ matrix.pattern }}" --pattern checksums.txt --dir dl
          cd dl
          archive=$(ls deck_*)
          grep " $archive\$" checksums.txt > want.txt
          if command -v sha256sum >/dev/null; then sha256sum -c want.txt; else shasum -a 256 -c want.txt; fi
          case "$archive" in
            *.zip) unzip -q "$archive" ;;
            *) tar -xzf "$archive" ;;
          esac

      - name: Run
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          out=$(./dl/deck --version)
          echo "$out"
          case "$out" in
            *"${TAG#v}"*) ;;
            *) echo "::error::deck --version does not say ${TAG#v}"; exit 1 ;;
          esac
          ./dl/deck --help >/dev/null

  # The desktop app on each system, with this commit's engine inside, added
  # to the same release: the Windows installer (.exe), the macOS .dmg and
  # .zip, and the Linux AppImage and .deb, with the latest*.yml files the
  # app's updater reads. The apps are not code-signed.
  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop-shell
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-shell/package-lock.json

      - run: npm ci

      # The app's version is the tag's, without the "v" or build metadata.
      - name: Version
        run: |
          v="${TAG#v}"
          npm version "${v%%+*}" --no-git-tag-version --allow-same-version

      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run build
          DECK_VERSION="${TAG#v}" npm run build:deck
          npx electron-builder --publish never

      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(release/*.exe release/*.dmg release/*.zip release/*.AppImage release/*.deb release/*.blockmap release/latest*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::electron-builder made no installer"
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  # Copy the verified release to the public releases repository, which is where
  # the installers download from. Needs a RELEASES_TOKEN secret: a fine-grained
  # token with Contents: read and write on dev-dami/deck-releases only. The
  # CLI is copied even when a desktop build failed.
  publish:
    needs: [release, verify, desktop]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release.outputs.tag }}
      PUBLIC_REPO: dev-dami/deck-releases
    steps:
      - name: Copy to the public repository
        env:
          SOURCE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$PUBLIC_TOKEN" ]; then
            echo "::warning::RELEASES_TOKEN is not set; $TAG was not copied to $PUBLIC_REPO"
            exit 0
          fi
          GH_TOKEN="$SOURCE_TOKEN" gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl
          pre=$(GH_TOKEN="$SOURCE_TOKEN" gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease)
          cat > notes.md <<NOTES
          Deck $TAG

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/$PUBLIC_REPO/main/install.sh | DECK_VERSION='$TAG' sh
          \`\`\`

          \`\`\`powershell
          \$env:DECK_VERSION='$TAG'; irm https://raw.githubusercontent.com/$PUBLIC_REPO/main/install.ps1 | iex
          \`\`\`

          Check downloads against \`checksums.txt\`.
          NOTES
          export GH_TOKEN="$PUBLIC_TOKEN"
          if gh release view "$TAG" --repo "$PUBLIC_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dl/* --repo "$PUBLIC_REPO" --clobber
          elif [ "$pre" = "true" ]; then
            gh release create "$TAG" dl/* --repo "$PUBLIC_REPO" --target main --title "$TAG" --notes-file notes.md --prerelease --latest=false
          else
            gh release create "$TAG" dl/* --repo "$PUBLIC_REPO" --target main --title "$TAG" --notes-file notes.md --latest
          fi
